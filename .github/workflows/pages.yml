name: Site public Tools Launcher
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # Ce workflow est exporté, mais ne publie jamais le dépôt privé.
    if: github.repository == 'wood51/tools-launcher'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
